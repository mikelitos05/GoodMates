services:
  db:
    image: mysql:8.0
    container_name: goodmates-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-goodmates_root}
      MYSQL_DATABASE: ${DB_NAME:-goodmates}
      MYSQL_USER: ${DB_USER:-goodmates_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-goodmates_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - goodmates-network

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: goodmates-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5001}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-goodmates_user}
      DB_PASSWORD: ${DB_PASSWORD:-goodmates_root}
      DB_NAME: ${DB_NAME:-goodmates}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - goodmates-network

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: goodmates-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - goodmates-network

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  goodmates-network:
    driver: bridge
