# ============================================================
# buildspec.yml - Instrucciones de Build para AWS CodeBuild
# ============================================================
# Este archivo define las fases del proceso de CI/CD:
#   1. install     -> Instala dependencias del sistema
#   2. pre_build   -> Verifica el entorno y corre tests
#   3. build       -> Compila el frontend React
#   4. post_build  -> Sube el frontend a S3
#
# Referenciado en: infra/aws/codepipeline.yaml
# ============================================================

version: 0.2

env:
  variables:
    NODE_ENV: production
    # Las siguientes variables se definen en CodeBuild o via Parameter Store
    # PROJECT_NAME: goodmates
    # FRONTEND_BUCKET: goodmates-frontend-ACCOUNT_ID
    # AWS_REGION: us-east-1

phases:

  # ── Fase 1: Instalacion ─────────────────────────────────────
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - echo "=== [1/4] Instalando dependencias ==="
      - echo "Node version:   $(node --version)"
      - echo "npm version:    $(npm --version)"
      - echo "Python version: $(python3 --version)"
      - echo "Directorio:     $(pwd)"
      - echo "Archivos del proyecto:"
      - ls -la

      # Instalar dependencias del backend
      - echo "--- Instalando dependencias del backend ---"
      - cd backend
      - npm ci
      - cd ..

      # Instalar dependencias del frontend
      - echo "--- Instalando dependencias del frontend ---"
      - cd frontend
      - npm ci
      - cd ..

  # ── Fase 2: Pre-Build (Verificacion y Tests) ─────────────────
  pre_build:
    commands:
      - echo "=== [2/4] Verificacion y Tests ==="

      # Verificar conexion con AWS
      - echo "Verificando credenciales AWS..."
      - aws sts get-caller-identity

      # Ejecutar tests del backend (si existen)
      - echo "--- Tests del backend ---"
      - cd backend
      - |
        if [ -f "package.json" ] && grep -q '"test"' package.json; then
          npm test -- --passWithNoTests --watchAll=false 2>/dev/null || echo "Tests del backend omitidos"
        else
          echo "Sin tests configurados en el backend"
        fi
      - cd ..

      # Ejecutar tests del frontend
      - echo "--- Tests del frontend ---"
      - cd frontend
      - |
        if [ -f "package.json" ] && grep -q '"test"' package.json; then
          CI=true npm test -- --passWithNoTests --watchAll=false 2>/dev/null || echo "Tests del frontend con advertencias"
        else
          echo "Sin tests configurados en el frontend"
        fi
      - cd ..

      - echo "Pre-build completado exitosamente"

  # ── Fase 3: Build (Compilar React) ───────────────────────────
  build:
    commands:
      - echo "=== [3/4] Compilando aplicacion ==="
      - echo "Build iniciado en: $(date)"

      # Construir el bundle de produccion de React
      - cd frontend
      - echo "Construyendo frontend React..."
      - npm run build
      - echo "Archivos generados en build/:"
      - ls -la build/
      - echo "Tamano total del build:"
      - du -sh build/
      - cd ..

      - echo "Build completado en: $(date)"

  # ── Fase 4: Post-Build (Deploy a S3) ─────────────────────────
  post_build:
    commands:
      - echo "=== [4/4] Desplegando frontend a S3 ==="

      # Verificar que el build existe
      - |
        if [ ! -d "frontend/build" ]; then
          echo "ERROR: No se encontro el directorio frontend/build"
          exit 1
        fi

      # Subir index.html SIN cache (para que siempre se sirva la version nueva)
      - echo "Subiendo index.html (sin cache)..."
      - |
        aws s3 cp frontend/build/index.html \
          s3://${FRONTEND_BUCKET}/index.html \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html" \
          --region ${AWS_REGION}

      # Subir JS/CSS con cache largo (tienen hash en el nombre)
      - echo "Subiendo assets estaticos (con cache largo)..."
      - |
        aws s3 sync frontend/build/ s3://${FRONTEND_BUCKET}/ \
          --exclude "index.html" \
          --cache-control "public, max-age=31536000, immutable" \
          --delete \
          --region ${AWS_REGION}

      # Invalidar cache de CloudFront
      - echo "Invalidando cache de CloudFront..."
      - |
        DIST_ID=$(aws cloudformation describe-stacks \
          --stack-name ${PROJECT_NAME}-prod \
          --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
          --output text \
          --region ${AWS_REGION} 2>/dev/null || echo "")

        if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"
          echo "Cache invalidado: $DIST_ID"
        else
          echo "CloudFront distribution no encontrada, omitiendo invalidacion"
        fi

      - echo "=== Deploy completado exitosamente en $(date) ==="

# ── Artefactos de salida ──────────────────────────────────────
artifacts:
  files:
    - "**/*"
  base-directory: frontend/build
  name: goodmates-frontend-build

# ── Cache para acelerar builds futuros ───────────────────────
cache:
  paths:
    - frontend/node_modules/**/*
    - backend/node_modules/**/*
    - /root/.npm/**/*
