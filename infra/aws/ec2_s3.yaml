# ============================================================
# ec2_s3.yaml - AWS CloudFormation para GoodMates
# Infraestructura con EC2 + S3 (AWS Academy / LabRole)
# ============================================================
# Recursos:
#   - VPC + Subnets + Internet Gateway
#   - Security Group (puertos 22, 80, 443, 5001)
#   - EC2 t2.micro con Amazon Linux 2023
#   - S3 Buckets para frontend, uploads y pipeline
#   - Usa LabInstanceProfile existente (AWS Academy)
#
# Despliegue:
#   aws cloudformation deploy \
#     --template-file infra/aws/ec2_s3.yaml \
#     --stack-name goodmates-ec2 \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       KeyPairName=goodmates-keypair \
#       DBPassword=TuPassword123
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: "GoodMates - EC2 + S3 con LabRole para AWS Academy"

# ── Parametros ───────────────────────────────────────────────
Parameters:

  ProjectName:
    Type: String
    Default: goodmates
    Description: Nombre del proyecto

  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Nombre del Key Pair para acceso SSH a EC2"

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t2.small, t2.medium, t3.micro]
    Description: "Tipo de instancia EC2 (t2.micro es Free Tier)"

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: "AMI de Amazon Linux 2023 (se obtiene automaticamente)"

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Default: GoodMates2024!
    Description: "Password para MySQL local en EC2"

  GitHubRepo:
    Type: String
    Default: "https://github.com/TU_USUARIO/GoodMates.git"
    Description: "URL del repositorio GitHub del proyecto"

# ── Recursos ─────────────────────────────────────────────────
Resources:

  # ============================================================
  # VPC y Red
  # ============================================================
  GoodMatesVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref GoodMatesVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GoodMatesVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet"

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GoodMatesVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ============================================================
  # Security Group - Reglas de firewall para EC2
  # ============================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Reglas de acceso para el servidor GoodMates"
      VpcId: !Ref GoodMatesVPC
      SecurityGroupIngress:
        # SSH para administracion remota
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: "SSH"
        # HTTP publico (frontend)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "HTTP"
        # HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "HTTPS"
        # Puerto del backend API Node.js
        - IpProtocol: tcp
          FromPort: 5001
          ToPort: 5001
          CidrIp: 0.0.0.0/0
          Description: "GoodMates Backend API"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ec2-sg"

  # ============================================================
  # EC2 - Servidor principal de GoodMates
  # ============================================================
  GoodMatesEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      # Usar el Instance Profile de SSM que ya existe en AWS Academy
      IamInstanceProfile: !Sub "c209451a5317927l14664762t1w${AWS::AccountId}-SsmRoleInstanceProfile-KYICfGn56jrg"

      # Script de inicializacion (User Data)
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/goodmates-init.log 2>&1

          echo "=== Iniciando configuracion de GoodMates en EC2 ==="
          echo "Fecha: $(date)"

          # Actualizar sistema
          dnf update -y
          dnf install -y git curl wget jq

          # Instalar Node.js 20
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          echo "Node.js instalado: $(node --version)"

          # Instalar PM2
          npm install -g pm2
          echo "PM2 instalado: $(pm2 --version)"

          # Instalar MySQL
          dnf install -y mysql-server
          systemctl enable mysqld
          systemctl start mysqld

          # Crear base de datos
          mysql -e "CREATE DATABASE IF NOT EXISTS ${ProjectName};"
          mysql -e "CREATE USER IF NOT EXISTS '${ProjectName}_user'@'localhost' IDENTIFIED BY '${DBPassword}';"
          mysql -e "GRANT ALL PRIVILEGES ON ${ProjectName}.* TO '${ProjectName}_user'@'localhost';"
          mysql -e "FLUSH PRIVILEGES;"
          echo "MySQL configurado"

          # Clonar repositorio
          git clone ${GitHubRepo} /opt/goodmates || (cd /opt/goodmates && git pull)
          chown -R ec2-user:ec2-user /opt/goodmates

          # Instalar dependencias del backend
          cd /opt/goodmates/backend
          npm ci --omit=dev
          echo "Dependencias instaladas"

          # Crear archivo .env para el backend
          cat > /opt/goodmates/backend/.env << 'ENVFILE'
          PORT=5001
          NODE_ENV=production
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=${ProjectName}
          DB_USER=${ProjectName}_user
          DB_PASSWORD=${DBPassword}
          JWT_SECRET=$(openssl rand -base64 48)
          FRONTEND_URL=http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          ENVFILE

          # Iniciar el backend con PM2
          cd /opt/goodmates/backend
          su -c "pm2 start src/server.js --name goodmates-backend" ec2-user
          su -c "pm2 save" ec2-user
          pm2 startup systemd -u ec2-user --hp /home/ec2-user

          echo "=== GoodMates Backend iniciado exitosamente ==="
          echo "Health check: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):5001/api/health"

      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-server"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # IP Elastica para la instancia (IP fija aunque se reinicie)
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref GoodMatesEC2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-eip"

  # ============================================================
  # S3 Buckets
  # ============================================================

  # Bucket para el frontend React (build estatico)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
      # Bloquear acceso publico directo (CloudFront es el punto de entrada)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: frontend-hosting

  # Bucket para uploads de imagenes de propiedades
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-uploads-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: property-images

  # Bucket para artefactos del pipeline CI/CD
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: codepipeline-artifacts

# ── Outputs ──────────────────────────────────────────────────
Outputs:

  EC2PublicIP:
    Description: "IP publica del servidor EC2 (fija con Elastic IP)"
    Value: !Ref ElasticIP
    Export:
      Name: !Sub "${ProjectName}-ec2-ip"

  EC2InstanceId:
    Description: "ID de la instancia EC2"
    Value: !Ref GoodMatesEC2
    Export:
      Name: !Sub "${ProjectName}-ec2-id"

  BackendURL:
    Description: "URL del backend API en EC2"
    Value: !Sub "http://${ElasticIP}:5001/api/health"
    Export:
      Name: !Sub "${ProjectName}-backend-url"

  FrontendBucketName:
    Description: "Nombre del bucket S3 para el frontend"
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${ProjectName}-frontend-bucket"

  UploadsBucketName:
    Description: "Nombre del bucket S3 para uploads de imagenes"
    Value: !Ref UploadsBucket
    Export:
      Name: !Sub "${ProjectName}-uploads-bucket"

  PipelineBucketName:
    Description: "Bucket de artefactos para CodePipeline"
    Value: !Ref PipelineArtifactsBucket
    Export:
      Name: !Sub "${ProjectName}-pipeline-bucket"

  SSHCommand:
    Description: "Comando SSH para conectarse al servidor"
    Value: !Sub "ssh -i ~/.ssh/${KeyPairName}.pem ec2-user@${ElasticIP}"
