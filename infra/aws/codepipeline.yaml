# ============================================================
# codepipeline.yaml - AWS CodePipeline para GoodMates
# VERSION AWS ACADEMY - Usa LabRole y CodeCommit
# ============================================================
# Pipeline: CodeCommit -> CodeBuild -> EC2 (via SSM)
#
# IMPORTANTE para AWS Academy:
#   - Usa LabRole (unico rol disponible en Academy)
#   - CodeCommit como fuente (en lugar de GitHub)
#   - No crea IAM Roles propios (restriccion de Academy)
#
# Despliegue:
#   aws cloudformation deploy \
#     --template-file infra/aws/codepipeline.yaml \
#     --stack-name goodmates-pipeline \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       EC2InstanceId=i-0abc1234567890
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: "GoodMates - CI/CD con CodeCommit + CodePipeline + CodeBuild + SSM (AWS Academy)"

Parameters:

  ProjectName:
    Type: String
    Default: goodmates

  BranchName:
    Type: String
    Default: main
    Description: "Rama de CodeCommit que activa el pipeline"

  EC2InstanceId:
    Type: String
    Description: "ID de la instancia EC2 donde se desplegara la app (ej: i-0abc1234)"

Resources:

  # ============================================================
  # CodeCommit - Repositorio de codigo fuente
  # ============================================================
  GoodMatesRepo:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-repo"
      RepositoryDescription: "Repositorio de GoodMates para CI/CD con CodePipeline"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # S3 - Bucket para artefactos del pipeline
  # ============================================================
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: BorrarArtefactosViejos
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # CodeBuild - Compila el proyecto y sube frontend a S3
  # ============================================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-build"
      Description: "Build automatico de GoodMates: tests + npm build + deploy S3"

      # Usar LabRole (unico rol disponible en AWS Academy)
      ServiceRole: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

      Source:
        Type: CODEPIPELINE
        BuildSpec: infra/aws/buildspec.yml

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0   # Incluye Node.js 20 y Python 3.12
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: FRONTEND_BUCKET
            Value: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
          - Name: EC2_INSTANCE_ID
            Value: !Ref EC2InstanceId

      Artifacts:
        Type: CODEPIPELINE

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}"

      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # CodePipeline - Orquesta todo el proceso CI/CD
  # ============================================================
  GoodMatesPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"

      # Usar LabRole para CodePipeline
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket

      Stages:

        # ── Etapa 1: SOURCE - Detecta cambios en CodeCommit ──
        - Name: Source
          Actions:
            - Name: CodigoFuente
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              Configuration:
                RepositoryName: !GetAtt GoodMatesRepo.Name
                BranchName: !Ref BranchName
                PollForSourceChanges: true   # Polling cada minuto
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1

        # ── Etapa 2: BUILD - CodeBuild compila y prueba ──────
        - Name: Build
          Actions:
            - Name: CompilarYTestear
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # ── Etapa 3: DEPLOY - Actualiza el backend en EC2 ────
        - Name: Deploy
          Actions:
            - Name: DesplegarEnEC2
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: Lambda
                Version: "1"
              Configuration:
                FunctionName: !Ref DeployLambda
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # Lambda - Ejecuta el deploy en EC2 via SSM
  # ============================================================
  DeployLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-deploy-ec2"
      Description: "Despliega GoodMates en EC2 usando AWS Systems Manager"
      Runtime: python3.12
      Handler: index.handler
      # Usar LabRole tambien para Lambda
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Timeout: 300
      Environment:
        Variables:
          EC2_INSTANCE_ID: !Ref EC2InstanceId
          PROJECT_NAME: !Ref ProjectName
      Code:
        ZipFile: |
          import boto3
          import os
          import time

          def handler(event, context):
              ssm = boto3.client('ssm')
              codepipeline = boto3.client('codepipeline')
              instance_id = os.environ['EC2_INSTANCE_ID']
              job_id = event['CodePipeline.job']['id']

              try:
                  print(f"Iniciando deploy en EC2: {instance_id}")

                  resp = ssm.send_command(
                      InstanceIds=[instance_id],
                      DocumentName='AWS-RunShellScript',
                      Comment='Deploy automatico via CodePipeline',
                      Parameters={
                          'commands': [
                              'set -e',
                              'echo "=== Deploy GoodMates - $(date) ==="',
                              'cd /opt/goodmates',
                              'git pull origin main',
                              'cd backend && npm ci --omit=dev',
                              'pm2 restart goodmates-backend || pm2 start src/server.js --name goodmates-backend',
                              'pm2 save',
                              'echo "=== Deploy completado - $(date) ==="',
                              'curl -s http://localhost:5001/api/health',
                          ],
                      },
                  )
                  cmd_id = resp['Command']['CommandId']
                  print(f"Comando SSM: {cmd_id}")

                  # Esperar resultado (max 4 min)
                  for i in range(24):
                      time.sleep(10)
                      inv = ssm.get_command_invocation(
                          CommandId=cmd_id, InstanceId=instance_id)
                      status = inv['Status']
                      print(f"Intento {i+1}/24 - Estado: {status}")
                      if status == 'Success':
                          print(inv.get('StandardOutputContent', ''))
                          codepipeline.put_job_success_result(jobId=job_id)
                          return
                      elif status in ['Failed', 'Cancelled', 'TimedOut']:
                          raise Exception(f"SSM fallo: {inv.get('StandardErrorContent', status)}")

                  raise Exception("Timeout esperando SSM")

              except Exception as e:
                  print(f"ERROR: {e}")
                  codepipeline.put_job_failure_result(
                      jobId=job_id,
                      failureDetails={'type': 'JobFailed', 'message': str(e)[:1000]}
                  )
                  raise

  DeployLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-deploy-ec2"
      RetentionInDays: 7

# ── Outputs ───────────────────────────────────────────────────
Outputs:

  CodeCommitCloneURL:
    Description: "URL HTTPS para clonar/pushear al repositorio CodeCommit"
    Value: !GetAtt GoodMatesRepo.CloneUrlHttp

  CodeCommitCloneSSH:
    Description: "URL SSH para clonar/pushear al repositorio CodeCommit"
    Value: !GetAtt GoodMatesRepo.CloneUrlSsh

  PipelineName:
    Description: "Nombre del pipeline CI/CD"
    Value: !Ref GoodMatesPipeline

  PipelineConsoleURL:
    Description: "URL directa al pipeline en la consola AWS"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${GoodMatesPipeline}/view"
