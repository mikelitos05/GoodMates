<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Door frame -->
  <rect x="90" y="10" width="10" height="240" rx="2" fill="#E8604A"/>
  <rect x="90" y="10" width="50" height="10" rx="2" fill="#E8604A"/>
  <!-- Door -->
  <rect x="15" y="10" width="80" height="240" rx="8" fill="#F07167"/>
  <!-- Door knob -->
  <circle cx="80" cy="140" r="6" fill="white"/>
  <!-- Person body - triangle -->
  <path d="M115 120 L155 230 L100 230 Z" fill="#FBB040"/>
  <!-- Person arm waving -->
  <path d="M130 130 Q160 80 170 70" stroke="#FBB040" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Person head -->
  <circle cx="150" cy="70" r="22" fill="#FBB040"/>
  <!-- Smile -->
  <path d="M140 77 Q150 88 160 77" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Person legs -->
  <rect x="110" y="230" width="12" height="20" rx="3" fill="#E8604A"/>
  <rect x="132" y="230" width="12" height="20" rx="3" fill="#E8604A"/>
</svg>
